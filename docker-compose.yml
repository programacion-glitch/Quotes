services:
  h2o-quote-bot:
    build: .
    image: h2o-quote-rpa:latest
    container_name: h2o-quote-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Proxy de IA (clasificador de commodities) = servicio Windows del host.
      - OPENAI_BASE_URL=http://host.docker.internal:3000/v1
      # GEICO HEADFUL bajo Xvfb (ver CMD del Dockerfile): Imperva bloqueaba el
      # chromium-headless-shell con Error 15 'Access denied' (2026-07-31,
      # logs/geico_login_failed.png — 4 jobs seguidos). Headful replica la
      # config validada en el host (.env: GEICO_HEADLESS=false, wins de junio).
      # Su PDF degrada a PNG (page.pdf() es headless-only; ya hay fallback).
      - GEICO_HEADLESS=false
      # Progressive sigue headless: su portal no tiene Imperva y funciona.
      - PROGRESSIVE_HEADLESS=true
      # ⚠️ GEICO DEPENDE DE LA VPN (diagnosticado 2026-08-06): Imperva bloquea
      # gateway.geico.com por IP — sin VPN da Error 15 a TODO desde esta red
      # (contenedor, host y hasta el Chrome normal del usuario; curl da 403),
      # mientras ecams/sales.geico.com sí responden. Con la VPN en EE.UU. el
      # gateway redirige normal al login B2C. NO es detección de bot: si vuelve
      # el Error 15, revisar la VPN ANTES de tocar stealth.py.
      # El contenedor sale por la IP del host (verificar: docker exec
      # h2o-quote-bot curl -s https://api.ipify.org).
      #
      # APAGADO por el REDISEÑO del dashboard (2026-08-06): con la VPN el login
      # ya entra bien, pero GEICO reemplazó el widget de productos por un modal
      # "Start New Quote" (ZIP → Search Products → checkbox Commercial Auto/
      # Trucking → Start Quote) y el USDOT quedó en su propia tarjeta. Hasta
      # re-mapear dashboard_page.py, todo job GEICO muere en 'dashboard'.
      # Reactivar tras el re-mapeo: true + docker compose up -d (sin rebuild).
      - GEICO_QUEUE_ENABLED=false
      # Sync de reglas REACTIVADO (2026-08-04): el master nuevo de Drive
      # (REGLAS_DRIVE_FILE_ID en .env, subido por el usuario) ya contiene las
      # correcciones de Diana (olas 1 y 2) — verificado contra el local.
      # OJO: el archivo viejo fue ELIMINADO de Drive; si el .env apunta al ID
      # viejo, el sync falla y cae al xlsx local (fail-safe).
      - REGLAS_SYNC_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"            # estabilidad de Chromium
    volumes:
      # RW (no :ro): el sync de reglas de Drive ESCRIBE el xlsx descargado y
      # refresca el token OAuth (config/oauth_user_token.json) dentro de config/.
      - ./config:/app/config
      - ./data:/app/data       # token/credenciales/sesiones/cola/PDFs/cutoff (persistente)
      - ./logs:/app/logs
    healthcheck:
      # Anclado a ^python: el sh -c del CMD también contiene el nombre del
      # módulo en su cmdline y daba healthy con el runner muerto.
      test: ["CMD", "pgrep", "-f", "^python -u -m modules.quote_queue.runner"]
      interval: 60s
      timeout: 10s
      retries: 3
